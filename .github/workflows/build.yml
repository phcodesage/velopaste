name: macOS build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Package native app
        run: ./scripts/build.sh
      - name: Archive app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/Velopaste.app dist/Velopaste-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Velopaste-macOS
          path: dist/Velopaste-macOS.zip
