name: macOS build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test
      - name: Package native app
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Velopaste-macOS
          path: dist/Velopaste.app
